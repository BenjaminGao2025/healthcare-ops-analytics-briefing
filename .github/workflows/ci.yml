name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check . --exclude data/raw --exclude .venv

      - name: Test
        run: pytest -q

      - name: Validate notebook JSON
        run: python -m json.tool notebooks/01_eda_wait_times.ipynb > /tmp/01_eda_wait_times.json
